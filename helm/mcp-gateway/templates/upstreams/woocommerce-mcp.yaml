apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  namespace: {{ .Values.namespaces.store }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woocommerce-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woocommerce-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: woocommerce-mcp
    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.upstreams.woocommerceMcp.image.repository | default "woocommerce-mcp" }}:{{ .Values.upstreams.woocommerceMcp.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.upstreams.woocommerceMcp.image.pullPolicy | default "IfNotPresent" }}
          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: WC_URL
              value: "http://wordpress.{{ .Values.namespaces.store }}.svc.cluster.local"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: wc-api-credentials
                  key: wc-consumer-key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: wc-api-credentials
                  key: wc-consumer-secret
            - name: INTERNAL_MCP_TOKEN
              value: "urumi_internal_mcp_secure_token_123"
            - name: REQUEST_TIMEOUT_MS
              value: "8000"
            - name: NODE_ENV
              value: "production"
          ports:
            - name: mcp-http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.upstreams.woocommerceMcp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        # Read-only root filesystem with ephemeral memory tmpfs for /tmp
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  namespace: {{ .Values.namespaces.store }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-mcp
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: mcp-http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: woocommerce-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
