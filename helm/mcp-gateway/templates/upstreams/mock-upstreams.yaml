apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-mcp
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: weather-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weather-mcp
          image: "{{ .Values.upstreams.weatherMcp.image.repository | default "mock-upstreams" }}:{{ .Values.upstreams.weatherMcp.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.upstreams.weatherMcp.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVICE_TYPE
              value: "weather"
            - name: WEATHER_PORT
              value: "3001"
            - name: INTERNAL_MCP_TOKEN
              value: "urumi_internal_mcp_secure_token_123"
            - name: NODE_ENV
              value: "production"
          ports:
            - name: mcp-http
              containerPort: 3001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp-http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.upstreams.weatherMcp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: weather-mcp
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: weather-mcp
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: mcp-http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: weather-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
---
