{{- if .Values.smokeTest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-smoke-test
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
spec:
  replicas: {{ .Values.smokeTest.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcp-gateway.name" . }}-smoke-test
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mcp-gateway.name" . }}-smoke-test
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: smoke-test
    spec:
      containers:
        - name: smoke-test
          image: "{{ .Values.smokeTest.image.repository }}:{{ .Values.smokeTest.image.tag }}"
          imagePullPolicy: {{ .Values.smokeTest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.smokeTest.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.smokeTest.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-smoke-test
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.smokeTest.service.type }}
  ports:
    - port: {{ .Values.smokeTest.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "mcp-gateway.name" . }}-smoke-test
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-smoke-test
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.gateway.ingress.className | default "nginx" }}
  rules:
    - host: smoke.{{ .Values.global.baseDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-gateway.fullname" . }}-smoke-test
                port:
                  number: {{ .Values.smokeTest.service.port }}
{{- end }}
