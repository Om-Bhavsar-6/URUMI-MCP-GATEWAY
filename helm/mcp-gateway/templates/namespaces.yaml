apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.store }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.gateway }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
