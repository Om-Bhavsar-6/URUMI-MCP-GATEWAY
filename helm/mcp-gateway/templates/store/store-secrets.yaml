apiVersion: v1
kind: Secret
metadata:
  name: store-db-credentials
  namespace: {{ .Values.namespaces.store }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  db-name: {{ .Values.store.database.name | quote }}
  db-user: {{ .Values.store.database.user | quote }}
  db-password: {{ .Values.store.database.password | default "wp_secure_password_123" | quote }}
  db-root-password: {{ .Values.store.database.rootPassword | default "root_secure_password_123" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-wp-credentials
  namespace: {{ .Values.namespaces.store }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
type: Opaque
stringData:
  wp-admin-user: {{ .Values.store.wordpress.adminUser | default "admin" | quote }}
  wp-admin-password: {{ .Values.store.wordpress.adminPassword | default "admin_secure_password_123" | quote }}
  wp-admin-email: {{ .Values.store.wordpress.adminEmail | default "admin@urumi.local" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wc-api-credentials
  namespace: {{ .Values.namespaces.store }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: woocommerce-api
type: Opaque
stringData:
  wc-url: "http://wordpress.{{ .Values.namespaces.store }}.svc.cluster.local"
  wc-consumer-key: {{ .Values.store.woocommerce.consumerKey | default "ck_placeholder" | quote }}
  wc-consumer-secret: {{ .Values.store.woocommerce.consumerSecret | default "cs_placeholder" | quote }}
