apiVersion: batch/v1
kind: Job
metadata:
  name: store-init-job
  namespace: {{ .Values.namespaces.store }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: store-init
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wp-cli-init
          image: "{{ .Values.store.init.image.repository | default "wordpress" }}:{{ .Values.store.init.image.tag | default "cli-php8.2" }}"
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - name: WORDPRESS_DB_HOST
              value: "mariadb.{{ .Values.namespaces.store }}.svc.cluster.local:3306"
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: store-db-credentials
                  key: db-name
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: store-db-credentials
                  key: db-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db-credentials
                  key: db-password
            - name: WP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: store-wp-credentials
                  key: wp-admin-user
            - name: WP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-wp-credentials
                  key: wp-admin-password
            - name: WP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: store-wp-credentials
                  key: wp-admin-email
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: wc-api-credentials
                  key: wc-consumer-key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: wc-api-credentials
                  key: wc-consumer-secret
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
            - name: init-script
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wordpress-wp-content
        - name: init-script
          configMap:
            name: store-init-script
            defaultMode: 0755
