apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-backend
          image: "{{ .Values.gateway.backend.image.repository | default "gateway-backend" }}:{{ .Values.gateway.backend.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.gateway.backend.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "4000"
            - name: POSTGRES_HOST
              value: "postgres.{{ .Values.namespaces.gateway }}.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.gateway.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.gateway.database.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.gateway.database.password | quote }}
            - name: JWT_SECRET
              value: {{ .Values.gateway.auth.jwtSecretKey | quote }}
            - name: NODE_ENV
              value: "production"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.gateway.resources.backend | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-backend
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gateway-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
